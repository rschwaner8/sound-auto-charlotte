<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Charlotte · Set up admin access</title><link rel="stylesheet" href="/style.css"></head>
<body><main style="max-width:600px;margin:40px auto;padding:20px"><h1>Set up your CRM password</h1><p>Create the admin login for Sound Auto and Finance. This form works once and requires the temporary setup code from your Render account.</p><form id="setup" class="panel"><label>Temporary setup code<input id="token" type="password" required autocomplete="off" maxlength="256"></label><label>New admin password<input id="password" type="password" required autocomplete="new-password" minlength="16" maxlength="256"></label><label>Confirm password<input id="confirm" type="password" required autocomplete="new-password" minlength="16" maxlength="256"></label><p>Use at least 16 characters and save your password in your password manager. Your username will be <strong>admin</strong>.</p><button type="submit">Create admin login</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="/ops">Go to CRM sign in</a></p></main><script type="module" src="/setup.js"></script></body></html>
