<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealerDesk · Sound Auto and Finance</title><link rel="stylesheet" href="/style.css"><style>[hidden]{display:none!important}.app>main{margin:0 auto}.workspace{grid-template-columns:300px minmax(0,1fr)}.conversation:empty:after{content:'No messages yet';color:var(--muted)}#error:not(:empty){background:#f9e6df;padding:15px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.lead-list button{overflow-wrap:anywhere}.login-panel{max-width:480px;margin:40px auto}.conversation-card{min-width:0}.nav-icon{display:inline-block;width:23px}.panel input:not([type=checkbox]),.panel select{width:100%}.badge{white-space:nowrap}@media(max-width:700px){.workspace{grid-template-columns:1fr}}</style></head><body><div class="app"><aside><a class="brand" href="/ops">D <span>DealerDesk</span></a><div class="eyebrow">DEALERSHIP WORKSPACE</div><nav><button data-view="today"><span class="nav-icon">◈</span>Today</button><button data-view="conversations"><span class="nav-icon">◦</span>Conversations</button><button data-view="customers"><span class="nav-icon">▤</span>Customers</button><button data-view="appointments"><span class="nav-icon">▦</span>Appointments</button><button data-view="inventory"><span class="nav-icon">▱</span>Inventory</button><button data-view="knowledge"><span class="nav-icon">◇</span>Knowledge Base</button><button data-view="reports"><span class="nav-icon">▥</span>Reports</button><button data-view="admin"><span class="nav-icon">⚙</span>Connections</button></nav><div class="aside-bottom"><span class="dot"></span>Hosted workspace<br><small>Texting activation pending</small></div></aside><main><header><div><small id="today-date"></small><h1 id="page-title">Your day, in focus.</h1><p id="page-subtitle">Every conversation. A clear next step.</p></div><button class="primary" data-view="customers">+ Add lead</button></header><div id="login" class="panel login-panel"><h2>Sign in to your dealership</h2><label>User<select id="user"><option>admin</option><option>staff</option></select></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button class="primary" id="signin">Sign in</button></div><div id="ops" hidden><div class="banner"><strong>HOSTED CRM</strong><span>Saved server records. Automatic texting remains disabled while registration and controlled testing are completed.</span><button id="refresh">Refresh</button></div><div id="view"></div></div><p id="error" role="status"></p></main></div><script type="module" src="/ops.js"></script></body></html>
