<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealerDesk | Dealership workspace</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside><a class="brand" href="#">D<span>DealerDesk</span></a><div class="eyebrow">DEALERSHIP WORKSPACE</div><nav id="nav"></nav><div class="aside-bottom"><span class="dot"></span> Review environment<br><small>No real messages sent</small></div></aside><main><header><div><small id="today"></small><h1 id="title">Your day, in focus.</h1><p id="subtitle">Every conversation. A clear next step.</p></div><button id="add" class="primary">+ Add lead</button></header><div class="banner"><strong>SIMULATION MODE</strong><span>Fictional customers and inventory. Demo data stays in this browser. Live accounts are not connected.</span></div><div id="content"></div></main></div><dialog id="modal"><form id="leadform"><h2>Add a customer</h2><label>Name<input name="name" required maxlength="120"></label><label>Phone (E.164)<input name="phone" placeholder="+12025550199"></label><label>Source<select name="source" id="source"></select></label><label>Vehicle<select name="vehicleId" id="vehicle"></select></label><label>Inquiry<textarea name="body" placeholder="What are they interested in?"></textarea></label><label class="check"><input name="consent" type="checkbox"> Simulated SMS consent (demo only)</label><div class="actions"><button type="button" id="close">Cancel</button><button class="primary">Create lead</button></div></form></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
